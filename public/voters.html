<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Manager Portal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: #f0f2f5; color: #1c1e21; }
        .header { background: #0284c7; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        input, textarea, button { width: 100%; padding: 11px; margin: 6px 0; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
        button { background: #16a34a; color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        td, th { border-bottom: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="header">Voter Management Portal</div>

    <div class="container">
        <div class="card">
            <h3>Register Individual Voter Profile</h3>
            <input type="text" id="vId" placeholder="Voter ID" />
            <input type="text" id="vName" placeholder="Full Name" />
            <input type="tel" id="vPhone" placeholder="Phone" />
            <button onclick="addVoter()">Save Voter Profile</button>
        </div>

        <div class="card">
            <h3>Bulk Assign Voter IDs to Booth</h3>
            <textarea id="bulkVoterIds" rows="4" placeholder="1234&#10;1235"></textarea>
            <input type="text" id="vBoothAssigned" placeholder="Booth Code (e.g. BOOTH-101)" />
            <button onclick="bulkAssign()" style="background:#0284c7;">Assign Voters</button>
        </div>

        <div class="card">
            <h3>Registered Voters List</h3>
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Booth</th><th>Status</th></tr></thead>
                <tbody id="voterTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadVoters() {
            const res = await fetch('/api/admin/voters');
            const list = await res.json();
            const tbody = document.getElementById('voterTable');
            tbody.innerHTML = '';
            list.forEach(v => {
                tbody.innerHTML += `<tr><td><b>${v.voter_id}</b></td><td>${v.full_name}</td><td>${v.assigned_booth}</td><td style="color:${v.has_voted?'#dc2626':'#16a34a'}">${v.has_voted?'VOTED':'READY'}</td></tr>`;
            });
        }

        async function addVoter() {
            const voterId = document.getElementById('vId').value;
            const fullName = document.getElementById('vName').value;
            const phone = document.getElementById('vPhone').value;

            await fetch('/api/admin/add-voter-profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'x-user-role': 'voter_manager'},
                body: JSON.stringify({ voterId, fullName, phone })
            });
            document.getElementById('vId').value = ''; document.getElementById('vName').value = '';
            loadVoters();
        }

        async function bulkAssign() {
            const rawVoterIds = document.getElementById('bulkVoterIds').value;
            const assignedBooth = document.getElementById('vBoothAssigned').value;

            await fetch('/api/admin/assign-voters', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'x-user-role': 'voter_manager'},
                body: JSON.stringify({ rawVoterIds, assignedBooth })
            });
            document.getElementById('bulkVoterIds').value = '';
            loadVoters();
        }

        loadVoters();
    </script>
</body>
</html>
