

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Voting Station Kiosk</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --accent: #0284c7; --border: #334155; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .kiosk-card { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 20px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .booth-tag { background: #0284c7; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 12px; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; outline: none; }
        input { background: #0f172a; color: white; text-align: center; letter-spacing: 2px; font-size: 18px; }
        .vote-btn { background: linear-gradient(135deg, #16a34a, #15803d); color: white; font-weight: bold; border: none; cursor: pointer; }
        .party-option { background: #0f172a; border: 2px solid var(--border); padding: 12px; border-radius: 12px; margin: 8px 0; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .party-option.selected { border-color: #0284c7; background: #1e3a8a; }
        .status-box { padding: 16px; border-radius: 14px; margin-top: 15px; font-weight: bold; }
        .closed-box { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        .cam-preview { width: 100%; height: 160px; background: #000; border-radius: 12px; object-fit: cover; margin-top: 10px; border: 1px solid var(--border); }
        .timer-badge { background: #dc2626; color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="kiosk-card">
        <div class="booth-tag" id="boothDisplay">BOOTH STATION: UNASSIGNED</div>
        <h2 style="margin-top:0;">Digital Voting Station</h2>

        <div id="closedView" style="display:none;" class="status-box closed-box">
            🚨 VOTING TIME CLOSED / INACTIVE!<br>
            <span id="closeReason" style="font-size:12px; font-weight:normal;">Official polling is not currently active for this booth.</span>
        </div>

        <div id="votingFormView">
            <div id="stepVoterId">
                <label style="font-size:12px; color:#94a3b8; display:block; text-align:center; font-weight:bold;">ENTER YOUR 6-DIGIT VOTER ID:</label>
                <input type="text" id="voterIdInput" maxlength="6" placeholder="123456" />
                <button class="vote-btn" onclick="proceedToBallot()">Verify Voter ID & Proceed ➔</button>
            </div>

            <div id="stepBallot" style="display:none;">
                <div class="timer-badge">⏳ Time Remaining: <span id="timerSecs">60</span>s</div>

                <label style="font-size:12px; color:#94a3b8; display:block; text-align:left; font-weight:bold; margin-bottom:8px;">1. SELECT YOUR PARTY CHOICE:</label>
                <div id="partiesList">Loading candidates...</div>

                <label style="font-size:12px; color:#94a3b8; display:block; text-align:left; font-weight:bold; margin-top:14px;">2. MANDATORY VERIFICATION PHOTO:</label>
                <video id="webcam" class="cam-preview" autoplay playsinline></video>
                <canvas id="photoCanvas" style="display:none;"></canvas>

                <button class="vote-btn" style="margin-top:16px;" onclick="castVote('USER')">CONFIRM & CAST VOTE 🗳️</button>
            </div>

            <div id="stepSuccess" style="display:none; text-align:left; background:#0f172a; padding:18px; border-radius:14px; border:1px solid #16a34a; margin-top:10px;">
                <h3 style="color:#16a34a; margin-top:0; text-align:center;">🎉 VOTE CAST SUCCESSFULLY!</h3>
                <p style="font-size:13px; margin:6px 0;"><b>Voter ID:</b> <span id="succVoterId"></span></p>
                <p style="font-size:13px; margin:6px 0;"><b>Voter Name:</b> <span id="succName"></span></p>
                <p style="font-size:13px; margin:6px 0;"><b>Phone:</b> <span id="succPhone"></span></p>
                <p style="font-size:13px; margin:6px 0;"><b>Booth:</b> <span id="succBooth"></span></p>
                <p style="font-size:13px; margin:6px 0;"><b>Status:</b> <span style="color:#16a34a; font-weight:bold;" id="succStatus"></span></p>
                <button class="vote-btn" style="margin-top:14px;" onclick="resetKiosk()">Next Voter ➔</button>
            </div>

            <p id="kioskMsg" style="color:#ef4444; font-size:13px; font-weight:bold; margin-top:10px;"></p>
        </div>
    </div>

    <script>
        let currentBooth = 'BOOTH-101';
        let selectedParty = null;
        let videoStream = null;
        let countdownTimer = null;
        let secondsLeft = 60;
        let activeVoter = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const boothParam = urlParams.get('booth');
            if (boothParam) currentBooth = boothParam.trim().toUpperCase();
            if (!currentBooth.startsWith('BOOTH-')) currentBooth = 'BOOTH-' + currentBooth;
            
            document.getElementById('boothDisplay').innerText = `BOOTH STATION: ${currentBooth}`;
            checkBoothStatus();
            setInterval(checkBoothStatus, 3000);
        });

        function playElectionBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        async function checkBoothStatus() {
            try {
                const res = await fetch(`/api/booth/check-status/${currentBooth}`);
                const data = await res.json();

                if (!data.allowed) {
                    document.getElementById('votingFormView').style.display = 'none';
                    document.getElementById('closedView').style.display = 'block';
                    document.getElementById('closeReason').innerText = data.error || "Booth is currently inactive.";
                    stopCamera();
                    clearInterval(countdownTimer);
                } else if (document.getElementById('closedView').style.display === 'block') {
                    document.getElementById('closedView').style.display = 'none';
                    document.getElementById('votingFormView').style.display = 'block';
                }
            } catch (e) {}
        }

        async function startCamera() {
            try {
                const video = document.getElementById('webcam');
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = videoStream;
            } catch (err) {
                console.warn("Camera fallback active:", err);
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function captureVerificationSnapshot() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('photoCanvas');
            canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d');

            if (videoStream && video.readyState === 4) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('VERIFIED VOTER SNAPSHOT', canvas.width / 2, canvas.height / 2);
            }
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        function start1MinuteTimer() {
            secondsLeft = 60;
            document.getElementById('timerSecs').innerText = secondsLeft;
            clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                secondsLeft--;
                document.getElementById('timerSecs').innerText = secondsLeft;
                if (secondsLeft <= 0) {
                    clearInterval(countdownTimer);
                    castVote('NST');
                }
            }, 1000);
        }

        async function proceedToBallot() {
            const vId = document.getElementById('voterIdInput').value.trim();
            const msg = document.getElementById('kioskMsg');

            if (!vId || vId.length !== 6 || isNaN(vId)) {
                msg.innerText = "Please enter a valid 6-digit Voter ID!";
                return;
            }

            msg.innerText = "";
            const vRes = await fetch('/api/vote/verify-voter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ voterId: vId, boothCode: currentBooth })
            });

            const vData = await vRes.json();
            if (!vRes.ok) {
                msg.innerText = vData.error || "Voter verification failed!";
                return;
            }

            activeVoter = vData.voter;

            const pRes = await fetch('/api/parties');
            const parties = await pRes.json();

            let pHTML = '';
            parties.forEach(p => {
                const boothCandidates = (p.candidates || []).filter(c => {
                    const cBooth = (c.assignedBooth || 'ALL').trim().toUpperCase();
                    return cBooth === 'ALL' || cBooth === currentBooth || ('BOOTH-' + cBooth) === currentBooth;
                });

                const candNames = boothCandidates.map(c => c.candidateName).join(', ') || 'General Candidate';

                pHTML += `
                    <div class="party-option" onclick="selectParty('${p.party_name}', this)">
                        <div>
                            <strong>${p.party_name}</strong><br>
                            <span style="font-size:11px; color:#94a3b8;">Candidate(s): ${candNames}</span>
                        </div>
                        <input type="radio" name="pChoice" />
                    </div>
                `;
            });

            pHTML += `
                <div class="party-option" onclick="selectParty('NOTA', this)">
                    <div><strong>NOTA</strong> (None of the Above)</div>
                    <input type="radio" name="pChoice" />
                </div>
            `;

            document.getElementById('partiesList').innerHTML = pHTML;
            document.getElementById('stepVoterId').style.display = 'none';
            document.getElementById('stepBallot').style.display = 'block';
            
            startCamera();
            start1MinuteTimer();
        }

        function selectParty(pName, el) {
            selectedParty = pName;
            document.querySelectorAll('.party-option').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function castVote(mode) {
            clearInterval(countdownTimer);
            const msg = document.getElementById('kioskMsg');

            let finalChoice = selectedParty;
            if (mode === 'NST') {
                finalChoice = 'NST';
            } else if (!finalChoice) {
                msg.innerText = "Please select a party or NOTA!";
                start1MinuteTimer();
                return;
            }

            const voterPhoto = captureVerificationSnapshot();

            const res = await fetch('/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    voterId: activeVoter.voter_id, 
                    partyId: finalChoice, 
                    boothCode: currentBooth, 
                    voterPhoto 
                })
            });

            const data = await res.json();
            if (res.ok) {
                stopCamera();
                playElectionBeep();

                const d = data.voterDetails;
                document.getElementById('succVoterId').innerText = d.voterId;
                document.getElementById('succName').innerText = d.fullName;
                document.getElementById('succPhone').innerText = d.phone;
                document.getElementById('succBooth').innerText = d.assignedBooth;
                document.getElementById('succStatus').innerText = d.voteStatus + (mode === 'NST' ? ' (AUTO-NST EXPIRED)' : '');

                document.getElementById('stepBallot').style.display = 'none';
                document.getElementById('stepSuccess').style.display = 'block';
            } else {
                msg.innerText = data.error || "Failed to cast vote!";
            }
        }

        function resetKiosk() {
            window.location.reload();
        }
    </script>
</body>
</html>
