<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Leader Portal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: #f0f2f5; color: #1c1e21; }
        .header { background: #16a34a; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        td, th { border-bottom: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="header">Party Leader Analytics Portal</div>

    <div class="container">
        <div class="card">
            <h3>🏆 Overall Party Ranks</h3>
            <table>
                <thead><tr><th>Rank</th><th>Party</th><th>Total Candidates</th><th>Total Votes</th><th>Share</th></tr></thead>
                <tbody id="leaderboardTable"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>📍 Candidate Performance By Booth</h3>
            <div id="boothMatrix">Loading booth performance...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('/api/admin/analytics');
            const d = await res.json();

            const tbody = document.getElementById('leaderboardTable');
            tbody.innerHTML = '';
            d.leaderboard.forEach((item, idx) => {
                tbody.innerHTML += `<tr><td>#${idx+1}</td><td><b>${item.party_name}</b></td><td>${item.totalCandidates}</td><td>${item.count}</td><td>${item.percentage}%</td></tr>`;
            });

            const matrixDiv = document.getElementById('boothMatrix');
            matrixDiv.innerHTML = '';
            for (let bCode in d.boothBreakdown) {
                let cHTML = '';
                d.boothBreakdown[bCode].candidateList.forEach(c => {
                    cHTML += `<li>${c.candidate_name} (${c.party_name}): <b>${c.votes}</b> votes</li>`;
                });
                matrixDiv.innerHTML += `<div style="border-bottom:1px solid #cbd5e1; padding:8px 0;"><strong>${bCode}</strong> (${d.boothBreakdown[bCode].location})<ul>${cHTML}</ul></div>`;
            }
        }
        loadData();
    </script>
</body>
</html>
